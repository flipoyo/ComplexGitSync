name: Release

# A release is cut from a tag, never by hand. Nothing here runs until somebody pushes a
# tag or starts the workflow; no token is stored anywhere — PyPI trusted publishing
# exchanges this workflow's identity for a short-lived upload credential.
#
# One-time setup, by the owner, on the package index (not automatable from here):
#   1. register ComplexGitSync as a trusted publisher on pypi.org and test.pypi.org
#      (workflow: release.yml, environments: pypi and testpypi);
#   2. create the `pypi` and `testpypi` environments in this repository's settings.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish a dry run"
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the version the package declares
        id: version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Only plain X.Y.Z releases are published
        # SemVer pre-releases (3.1.0-alpha.1) are not PEP 440 (3.1.0a1); nothing translates
        # between them, so a pre-release is never uploaded.
        run: |
          echo "${{ steps.version.outputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v${{ steps.version.outputs.version }}" = "${GITHUB_REF_NAME}"
      - name: The changelog has an entry for this version
        run: grep -Eq '^## \[?${{ steps.version.outputs.version }}\]?( |$)' CHANGELOG.md
      - name: Build the artefacts
        run: pipx run build --outdir dist .
      - name: Check the artefacts
        run: pipx run twine check dist/*
      - name: Smoke check the wheel outside the checkout
        run: |
          pipx install dist/*.whl
          cd "$RUNNER_TEMP" && bash "$GITHUB_WORKSPACE/scripts/smoke_installed.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
