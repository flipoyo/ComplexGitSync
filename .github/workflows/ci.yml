name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: prefix-dev/setup-pixi@v0.8.1
      - name: Install package
        run: pixi install
      - name: Run PR test subset
        run: pixi run python -m pytest tests/unit/test_documents.py tests/unit/test_cli_smoke.py
      - name: Run orchestration-focused PR tests
        run: pixi run python -m pytest tests/unit/test_registry_client.py -k orchestrate

  test-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: prefix-dev/setup-pixi@v0.8.1
      - name: Install package
        run: pixi install
      - name: Run full test suite
        run: pixi run test

  version-increment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_BOT_PAT != '' && secrets.CI_BOT_PAT || github.token }}
      - name: Increment YYYY.XX version
        id: increment_version
        run: |
          python - <<'EOF'
          import os, re, pathlib, subprocess

          pyproject = pathlib.Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")

          head_commit_subject = subprocess.check_output(
              ["git", "log", "-1", "--pretty=%s"],
              text=True,
          ).strip()
          skip_markers = ("chore: bump version", "[skip ci]", "[ci skip]")
          if any(m in head_commit_subject.lower() for m in skip_markers):
              print("Skipping version bump: latest commit is already a version bump.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("skip=true\n")
              raise SystemExit(0)

          match = re.search(r'^version\s*=\s*"(\d{4})\.(\d{2})"', text, re.MULTILINE)
          if not match:
              raise SystemExit("ERROR: version in pyproject.toml is not in YYYY.XX format")

          yyyy, xx = int(match.group(1)), int(match.group(2))
          if xx < 99:
              new_yyyy, new_xx = yyyy, xx + 1
          else:
              new_yyyy, new_xx = yyyy + 1, 1

          new_version = f"{new_yyyy:04d}.{new_xx:02d}"
          old_version = match.group(0).split('"')[1]

          # Update pyproject.toml
          new_text = re.sub(
              r'^(version\s*=\s*")' + re.escape(old_version) + r'"',
              rf'\g<1>{new_version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          pyproject.write_text(new_text, encoding="utf-8")

          # Update __init__.py
          init_path = pathlib.Path("src/ComplexGitSync/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          new_init = re.sub(
              r'^(__version__\s*=\s*")' + re.escape(old_version) + r'"',
              rf'\g<1>{new_version}"',
              init_text,
              count=1,
              flags=re.MULTILINE,
          )
          init_path.write_text(new_init, encoding="utf-8")

          # Update pixi.toml
          pixi_path = pathlib.Path("pixi.toml")
          pixi_text = pixi_path.read_text(encoding="utf-8")
          new_pixi = re.sub(
              r'^(version\s*=\s*")' + re.escape(old_version) + r'"',
              rf'\g<1>{new_version}"',
              pixi_text,
              count=1,
              flags=re.MULTILINE,
          )
          pixi_path.write_text(new_pixi, encoding="utf-8")

          # Update docs/preamble.tex
          preamble_path = pathlib.Path("docs/preamble.tex")
          preamble_text = preamble_path.read_text(encoding="utf-8")
          new_preamble = re.sub(
              r'^(\\newcommand\{\\cgsversion\}\{)' + re.escape(old_version) + r'\}',
              rf'\g<1>{new_version}}}',
              preamble_text,
              count=1,
              flags=re.MULTILINE,
          )
          preamble_path.write_text(new_preamble, encoding="utf-8")

          print(f"Bumped version: {old_version} -> {new_version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"new_version={new_version}\n")
              fh.write("skip=false\n")
          EOF
      - name: Commit and push version bump
        if: steps.increment_version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/ComplexGitSync/__init__.py pixi.toml docs/preamble.tex
          if git diff --cached --quiet; then
            echo "Nothing to commit, skipping."
          else
            git commit -m "chore: bump version to ${{ steps.increment_version.outputs.new_version }} [skip ci]"
            git push
          fi
