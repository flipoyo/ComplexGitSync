name: CI

on:
  push:
    branches: [main, lechat]
  pull_request:
    branches: [main, lechat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
      - name: Install package
        run: pixi install
      - name: Reconstitute the developer tree (dogfood cgitsync)
        run: pixi run cgitsync initialise examples/complexgitsync4dev.cgs --output-path .. --force-protocol https
      - name: Lint
        run: pixi run lint
      - name: Run tests
        run: pixi run test

  golden-vectors:
    # The State hash is a cross-platform contract (integrity_schema = 1): the
    # same tree must get the same digests on every platform pixi.toml declares.
    # No private-repository dogfood step: these two files need none.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
      - name: Install package
        run: pixi install
      - name: Golden vectors and the snapshot document
        run: pixi run python -m pytest tests/unit/test_gts_integrity.py tests/unit/test_gts_document.py

  versioning:
    # Verifies, never decides: a commit that moves __build__ must also raise
    # __version__ (Versioning.md). Reads the pushed range and writes nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.8.1
      - name: Every build bump comes with a version bump
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in
            0000000000000000000000000000000000000000..*) echo "new branch: no range to judge"; exit 0 ;;
          esac
          pixi run check-build-version "$RANGE"
