Implement only the Phase 3 TESTCASE ticket envelope supplied by the root
orchestrator. Read DevPlanTicket.md, AgentOrchestration.md, and the accepted
Phase 1 and Phase 2 contracts before editing.

Exercise CGSil1 as a black box through pixi run cgitsync. Do not use internal
