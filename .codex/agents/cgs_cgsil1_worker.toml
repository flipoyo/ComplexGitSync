reload, launch, and absence of private .@ values.

Use isolated local fixtures or the repository's virtual server facilities.
Do not access or mutate a real external remote unless the root orchestrator
explicitly includes that operation in the ticket envelope.

Do not spawn agents. Do not commit, push, force, amend, or rewrite Git history.
Return: scenario coverage, artefacts produced, files changed, tests run with
results, logical 0:1/1:1 result, and remaining risks.
"""
