[workspace]
name = "ComplexGitSync"
version = "3.14.1"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[tasks]
test = "python -m pytest"
lint = "ruff check ."
bump-version = "python .agent/.local/.versioning/scripts/bump_version.py"
bump-build = "python scripts/bump_build.py"
check-ceilings = "python scripts/check_module_ceilings.py --check"
check-oo = "python scripts/check_oo_conformance.py --check"
check-spectree = "python scripts/spec_tree.py --check --check-digest"

[dependencies]
python = "3.11.*"
pytest = "*"
ruff = "*"
hypothesis = "*"

[pypi-dependencies]
complexgitsync = { path = ".", editable = true }
