[workspace]
name = "ComplexGitSync"
version = "0002.22"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[tasks]
test = "python -m pytest"
lint = "ruff check ."
bump-version = "python scripts/bump_version.py"
check-ceilings = "python scripts/check_module_ceilings.py --check"

[dependencies]
python = "3.11.*"
pytest = "*"
ruff = "*"
hypothesis = "*"

[pypi-dependencies]
complexgitsync = { path = ".", editable = true }
