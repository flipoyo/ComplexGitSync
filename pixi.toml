[workspace]
name = "ComplexGitSync"
version = "0002.01"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[tasks]
test = "python -m pytest"
test-backend = "python -m pytest tests/unit/cgs"

[dependencies]
python = "3.11.*"
pytest = "*"

[pypi-dependencies]
complexgitsync = { path = ".", editable = true }
