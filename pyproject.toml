[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ComplexGitSync"
version = "0001.29"
description = "Synchronize nested Git repository trees from .cgs specs and .gts state snapshots."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "EPL-2.0" }
authors = [
    { name = "Nicolas Flipo" },
]
dependencies = [
    "tomli-w>=1.0,<2",
]

[project.optional-dependencies]
yaml = [
    "PyYAML>=6,<7",
]
dev = [
    "pytest>=8,<9",
    "PyYAML>=6,<7",
]

[project.scripts]
cgitsync = "ComplexGitSync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ComplexGitSync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
