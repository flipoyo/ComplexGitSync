[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ComplexGitSync"
version = "0002.29"
description = "Synchronize nested Git repository trees from .cgs specs and .gts state snapshots."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Nicolas Flipo" },
]
dependencies = [
    "tomli-w>=1.0,<2",
]

[project.optional-dependencies]
yaml = [
    "PyYAML>=6,<7",
]

[project.scripts]
cgitsync = "ComplexGitSync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ComplexGitSync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 12
